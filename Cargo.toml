[package]
name = "live-builds"
version = "0.1.0"
edition = "2024"
description = "Painel de partida de League of Legends para o 2º monitor, leve e só com APIs locais oficiais"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
